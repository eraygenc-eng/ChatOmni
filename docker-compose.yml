services:

  # PostgreSQL database
  postgres:
    image: postgres:18-alpine
    container_name: chatomni-postgres

    environment:
      POSTGRES_DB: chatomni
      POSTGRES_USER: chatomni_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatomni_local_password}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U chatomni_user -d chatomni"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # FastAPI backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chatomni-backend

    env_file:
      - .env

    environment:
      POSTGRES_URI: postgresql://chatomni_user:${POSTGRES_PASSWORD:-chatomni_local_password}@postgres:5432/chatomni

    # Backend is only reachable from inside
    # the Docker network through Nginx.
    expose:
      - "8000"

    volumes:
      - ./uploads:/app/uploads
      - ./projects_data:/app/projects_data

      # Required by ChatOmni's code sandbox
      - /var/run/docker.sock:/var/run/docker.sock

      - huggingface-cache:/root/.cache/huggingface

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  # React frontend + Nginx reverse proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: chatomni-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:

  postgres-data:

  huggingface-cache: